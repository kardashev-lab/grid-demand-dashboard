{{- if .Values.secret.create }}
{{- if not .Values.eiaApiKey }}
{{- fail "eiaApiKey is required (or set secret.create=false to reference an existing secret)" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secret.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "grid-demand.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.secret.key }}: {{ .Values.eiaApiKey | quote }}
{{- end }}
