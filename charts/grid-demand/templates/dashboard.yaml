# static React build served by nginx — proxies /api/* to the aggregator service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "grid-demand.labels" . | nindent 4 }}
    app: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        {{- include "grid-demand.labels" . | nindent 8 }}
        app: dashboard
    spec:
      containers:
        - name: dashboard
          image: {{ include "grid-demand.image" (dict "ctx" . "name" .Values.image.dashboard) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "grid-demand.labels" . | nindent 4 }}
spec:
  # LoadBalancer so minikube tunnel can expose it on localhost
  type: {{ .Values.dashboard.service.type }}
  selector:
    app: dashboard
  ports:
    - port: {{ .Values.dashboard.service.port }}
      targetPort: 80
---
{{- if .Values.dashboard.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dashboard
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "grid-demand.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dashboard
  minReplicas: {{ .Values.dashboard.hpa.minReplicas }}
  maxReplicas: {{ .Values.dashboard.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.dashboard.hpa.targetCPUUtilizationPercentage }}
{{- end }}
