x-fetcher-base: &fetcher-base
  build:
    context: ./services/fetcher
  depends_on:
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  redis:
    image: redis:7-alpine
    # no host port — avoids conflict with local Redis; fetchers/aggregator use redis:6379
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: griddemand
      POSTGRES_USER: griddemand
      POSTGRES_PASSWORD: griddemand
    # no host port — avoids conflict with local Postgres; aggregator uses postgres:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U griddemand -d griddemand']
      interval: 5s
      timeout: 3s
      retries: 10

  fetcher-caiso:
    <<: *fetcher-base
    environment:
      REGION: CAISO
      REDIS_URL: redis://redis:6379
      KARDASHEV_API_URL: ${KARDASHEV_API_URL:-https://data.kardashevlabs.org}
      POLL_INTERVAL: ${POLL_INTERVAL:-1200000}

  fetcher-ercot:
