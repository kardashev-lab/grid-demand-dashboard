      POLL_INTERVAL: ${POLL_INTERVAL:-1200000}

  aggregator:
    build:
      context: ./services/aggregator
    ports:
      - '3001:3000'   # 3001 on host — 3000 often taken by other dev stacks
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://griddemand:griddemand@postgres:5432/griddemand
      PORT: 3000
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build:
      context: ./services/dashboard
    ports:
      - '8080:80'
    environment:
      AGGREGATOR_API_URL: http://aggregator:3000
    depends_on:
      - aggregator
    restart: unless-stopped

volumes:
  pgdata:
